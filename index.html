<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fila Rotativa de Atendimento</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Atendimento</p>
          <h1>Fila rotativa</h1>
        </div>
        <div class="clock" id="clock">--:--</div>
      </header>

      <section class="hero-panel">
        <div>
          <span class="label">Próxima chamada</span>
          <h2 id="nextClient">Nenhum cliente na fila</h2>
          <p id="nextAgent">Cadastre atendentes e clientes para iniciar.</p>
        </div>
        <button class="primary-action" id="callNextBtn" type="button">Chamar próximo</button>
      </section>

      <section class="dashboard-grid">
        <article class="panel">
          <div class="panel-heading">
            <div>
              <span class="label">Equipe</span>
              <h3>Atendentes</h3>
            </div>
            <span class="counter" id="agentCount">0</span>
          </div>
          <form class="inline-form" id="agentForm">
            <input id="agentName" type="text" placeholder="Nome do atendente" autocomplete="off" required />
            <button type="submit">Adicionar</button>
          </form>
          <div class="list" id="agentList"></div>
        </article>

        <article class="panel">
          <div class="panel-heading">
            <div>
              <span class="label">Espera</span>
              <h3>Clientes</h3>
            </div>
            <span class="counter" id="queueCount">0</span>
          </div>
          <form class="inline-form" id="clientForm">
            <input id="clientName" type="text" placeholder="Nome ou senha" autocomplete="off" required />
            <button type="submit">Entrar</button>
          </form>
          <div class="list queue-list" id="queueList"></div>
        </article>

        <article class="panel wide-panel">
          <div class="panel-heading">
            <div>
              <span class="label">Registros</span>
              <h3>Histórico</h3>
            </div>
            <button class="ghost-button" id="clearHistoryBtn" type="button">Limpar</button>
          </div>
          <div class="history" id="historyList"></div>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
